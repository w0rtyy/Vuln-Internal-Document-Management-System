{% extends "base.html" %}
{% block content %}

<h2>Admin Panel</h2>

<h3>Users</h3>
<ul>
{% for user in users %}
    <li>{{ user.email }} ({{ user.role }})</li>
{% endfor %}
</ul>

<h3>Approve Document</h3>
<form method="post">
    <input name="doc_id" placeholder="Document ID">
    <button type="submit">Approve</button>
</form>

{% endblock %}
